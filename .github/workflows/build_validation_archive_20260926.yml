name: Build 2026-09-26 validation archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_validation_archive_20260926.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build validation archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import csv, json, itertools, re

          BASE = Path("data/2026-09-26")
          OUT = Path("out")
          OUT.mkdir(exist_ok=True)
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST).strftime("%Y-%m-%d %H:%M:%S")
          race_date = "2026-09-26"

          compact = json.loads((BASE / "nar_results_compact_20260926.json").read_text(encoding="utf-8"))
          full = json.loads((BASE / "nar_results_tables_20260926.json").read_text(encoding="utf-8"))
          m10 = json.loads((BASE / "m10_fixed_prediction_odds_20260926.json").read_text(encoding="utf-8"))

          preds = {
              "saga": {
                  2: {"idx":[1,6,4,3], "radar":10},
                  3: {"idx":[2,8,1,5], "radar":3},
                  4: {"idx":[9,10,6,4], "radar":1},
                  5: {"idx":[5,9,3,6], "radar":None},
                  6: {"idx":[7,4,8,1], "radar":2},
                  7: {"idx":[3,8,9,2], "radar":10},
                  8: {"idx":[8,5,7,4], "radar":1},
                  9: {"idx":[4,10,12,2], "radar":1},
                  10: {"idx":[9,7,1,10], "radar":2},
              },
              "kochi": {
                  1: {"idx":[3,4,8,10], "radar":None},
                  2: {"idx":[6,5,7,9], "radar":None},
                  3: {"idx":[7,6,9,11], "radar":4},
                  4: {"idx":[4,7,2,3], "radar":None},
                  5: {"idx":[6,2,7,8], "radar":None},
                  6: {"idx":[7,8,2,5], "radar":None},
                  7: {"idx":[7,1,6,5], "radar":None},
                  8: {"idx":[10,8,7,1], "radar":None},
                  9: {"idx":[7,1,6,4], "radar":None},
                  10: {"idx":[9,5,6,8], "radar":1},
                  11: {"idx":[12,2,10,5], "radar":None},
              }
          }
          jp = {"saga":"佐賀", "kochi":"高知"}
          baba = {"saga":"32", "kochi":"31"}

          def norm(seq):
              if isinstance(seq, str):
                  a = [int(x) for x in seq.split("-") if x]
              else:
                  a = [int(x) for x in seq]
              return "-".join(map(str, sorted(a)))

          def c2(a):
              return list(itertools.combinations(a,2))

          def c3(a):
              return list(itertools.combinations(a,3))

          def runners(track, rno):
              return compact["tracks"][track][str(rno)]["runners"]

          def rank_map(track, rno):
              return {x["horse_no"]:x["rank"] for x in runners(track,rno) if x["rank"] is not None}

          def name_map(track, rno):
              return {x["horse_no"]:x["horse_name"] for x in runners(track,rno)}

          def cancelled(track,rno):
              return {x["horse_no"] for x in runners(track,rno) if x["rank"] is None and ("取消" in x.get("status","") or "除外" in x.get("status",""))}

          def paymap(track,rno,ptype, ordered=False):
              out={}
              for x in compact["tracks"][track][str(rno)].get("payouts",{}).get(ptype,[]):
                  key=x["combination"] if ordered else norm(x["combination"])
                  out[key]=int(re.sub(r"\D","",x["payout"]))
              return out

          def place_payout(track,rno,horse):
              for x in compact["tracks"][track][str(rno)].get("payouts",{}).get("複勝",[]):
                  if str(x["combination"]) == str(horse):
                      return int(re.sub(r"\D","",x["payout"]))
              return 0

          def result_meta(track,rno):
              text=full["tracks"][track][str(rno)]["text"]
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              dist=None
              surface=""
              condition=""
              class_name=""
              for i,line in enumerate(lines):
                  m=re.search(r"(ダート|芝)\s*([0-9,]+)ｍ", line)
                  if m:
                      surface=m.group(1)
                      dist=int(m.group(2).replace(",",""))
                      if i>0:
                          class_name=lines[i-1]
                      mc=re.search(r"馬場：([^\s]+)", line)
                      if mc:
                          condition=mc.group(1)
                      break
              return {
                  "distance":dist,
                  "surface":surface,
                  "condition":condition,
                  "class":class_name,
                  "headcount":len(runners(track,rno)),
              }

          def top3(track,rno):
              xs=sorted([x for x in runners(track,rno) if x["rank"] in (1,2,3)], key=lambda x:x["rank"])
              return xs

          def exact_strategy(track,rno,p,kind):
              canc=cancelled(track,rno)
              active=[x for x in p["idx"] if x not in canc]
              if kind=="馬連4頭BOX":
                  bets=c2(active); ptype="馬連複"; ordered=False
              elif kind=="ワイド4頭BOX":
                  bets=c2(active); ptype="ワイド"; ordered=False
              elif kind=="3連複4頭BOX":
                  bets=c3(active); ptype="三連複"; ordered=False
              elif kind=="◎－○▲△ 馬連":
                  bets=[(active[0],x) for x in active[1:]] if active else []; ptype="馬連複"; ordered=False
              elif kind=="◎－○▲△ ワイド":
                  bets=[(active[0],x) for x in active[1:]] if active else []; ptype="ワイド"; ordered=False
              elif kind=="◎－○▲△－○▲△ 3連複":
                  bets=[(active[0],)+x for x in c2(active[1:])] if active else []; ptype="三連複"; ordered=False
              elif kind=="三連単2点":
                  q=p["idx"]
                  bets=[]
                  if len(q)>=4:
                      for seq in [(q[0],q[1],q[2]),(q[0],q[1],q[3])]:
                          if not any(x in canc for x in seq):
                              bets.append(seq)
                  ptype="三連単"; ordered=True
              else:
                  raise ValueError(kind)
              pm=paymap(track,rno,ptype,ordered)
              ret=0; hit_count=0
              for b in bets:
                  key="-".join(map(str,b)) if ordered else norm(b)
                  if key in pm:
                      ret += pm[key]
                      hit_count += 1
              return {"points":len(bets),"invest":100*len(bets),"return":ret,"hits":hit_count}

          threshold_cfg = {
              "◎－○▲△ 馬連（m10 15倍以上）": ("馬連","馬連複",15, lambda a:[(a[0],x) for x in a[1:]] if a else []),
              "◎－○▲△ ワイド（m10 7倍以上）": ("ワイド","ワイド",7, lambda a:[(a[0],x) for x in a[1:]] if a else []),
              "◎－○▲△－○▲△ 3連複（m10 30倍以上）": ("三連複","三連複",30, lambda a:[(a[0],)+x for x in c2(a[1:])] if a else []),
              "馬連4頭BOX（m10 20倍以上）": ("馬連","馬連複",20, lambda a:c2(a)),
              "ワイド4頭BOX（m10 10倍以上）": ("ワイド","ワイド",10, lambda a:c2(a)),
          }

          def m10_map(track,rno,bet):
              return {norm(x["combination"]):x for x in m10["tracks"][track][str(rno)].get(bet,[])}

          def threshold_strategy(track,rno,p,label):
              bet,ptype,th,builder=threshold_cfg[label]
              canc=cancelled(track,rno)
              active=[x for x in p["idx"] if x not in canc]
              om=m10_map(track,rno,bet)
              pm=paymap(track,rno,ptype,False)
              selected=[]
              for b in builder(active):
                  key=norm(b)
                  o=om.get(key)
                  if not o:
                      continue
                  if float(o["odds_low"]) >= th:
                      selected.append((key,float(o["odds_low"])))
              ret=sum(pm.get(k,0) for k,_ in selected)
              hit_count=sum(1 for k,_ in selected if k in pm)
              return {"points":len(selected),"invest":len(selected)*100,"return":ret,"hits":hit_count,"selected":selected}

          def radar_strategy(track,rno,p,label):
              radar=p["radar"]
              if radar is None:
                  return None
              canc=cancelled(track,rno)
              active=[x for x in p["idx"] if x not in canc]
              if label=="レーダー複勝":
                  ret=place_payout(track,rno,radar)
                  return {"points":1,"invest":100,"return":ret,"hits":1 if ret else 0}
              if label.startswith("レーダー－◎○▲"):
                  q=active[:3]
              else:
                  q=active[:2]
              bets=[(radar,x) for x in q if x!=radar]
              ptype="馬連複" if "馬連" in label else "ワイド"
              pm=paymap(track,rno,ptype,False)
              ret=0; hits=0
              for b in bets:
                  k=norm(b)
                  if k in pm:
                      ret+=pm[k]; hits+=1
              return {"points":len(bets),"invest":len(bets)*100,"return":ret,"hits":hits}

          validation_headers = [
              "index","検証ID","開催日","競馬場","R","予想方式","買い方","オッズ時点","オッズ条件",
              "点数","投資額","払戻額","収支","回収率","的中","使用オッズ原本","結果ソース",
              "確認状態","備考","外部原本パス","原本保存状態"
          ]
          master_validation_headers = validation_headers[1:]
          result_headers = [
              "結果ID","開催日","競馬場","R","確定状態","馬場","距離m","クラス","頭数",
              "1着馬番","1着馬名","2着馬番","2着馬名","3着馬番","3着馬名",
              "取消・除外","公式結果ソース","確定確認時刻","備考"
          ]
          prediction_headers = [
              "予想ID","開催日","競馬場","R","予想方式","固定日時","事前固定","対象状態",
              "レース条件","距離m","頭数","◎馬番","◎馬名","○馬番","○馬名","▲馬番","▲馬名",
              "△馬番","△馬名","レーダー馬番","レーダー馬名","AI評価","馬名照合状態","結果参照",
              "取消等","予想ソース","ルールVer","備考","◎指数値","○指数値","▲指数値","△指数値",
              "5位馬番(任意)","5位馬名(任意)","5位指数値(任意)","指数値入力状態"
          ]
          daily_headers = [
              "集計ID","開催日","競馬場","予想方式","買い方パターン","確認状態","的中数","対象R数",
              "的中率","投資額","払戻額","収支","回収率","オッズ条件","備考","結果ソース"
          ]
          metric_headers = [
              "指標ID","開催日","競馬場","予想方式","対象R数","◎1着数","◎1着率","◎3着内数","◎3着内率",
              "予想頭数","予想馬3着内頭数","4頭内3着捕捉率","1頭以上3着内R数","1頭以上3着内R率",
              "レーダー対象頭数","レーダー3着内数","レーダー3着内率","備考","レーダー1着数","レーダー1着率",
              "レーダー複勝投資","レーダー複勝払戻","レーダー複勝回収率","追加捕捉R数","追加捕捉率",
              "馬連救済R数","3連複救済R数","レーダー評価母数メモ","○3着内数","○3着内率",
              "上位3着全捕捉R数","上位3着全捕捉率","馬連BOX成立R数","馬連BOX成立率","ワイドBOX総的中本数",
              "ワイド1本取りR数","ワイド3本取りR数","ワイド3本取りR率","3連複BOX成立R数","3連複BOX成立率",
              "ワイド3本＋3連複同時R数","同時成立R率","ワイドBOX投資","ワイドBOX払戻","3連複BOX投資",
              "3連複BOX払戻","ワイド＋3連複合算投資","ワイド＋3連複合算払戻","ワイド＋3連複合算回収率",
              "同時成立Rワイド払戻","同時成立R3連複払戻","同時成立R合算払戻","レーダー4着数","レーダー4着率"
          ]
          radar_headers = [
              "レーダーID","開催日","競馬場","R","Q予想ID","レーダー馬番","レーダー馬名","選出有無",
              "根拠主タグ","根拠副タグ","内部スコア","信頼度","予想時人気","予想時単勝オッズ",
              "着順","3着内","1着","複勝投資","複勝払戻","複勝回収率","Q4頭3着内数","Q4+レーダー3着内数",
              "追加捕捉","馬連救済","3連複救済","結果ソース","確認状態","備考","ルールVer","4着"
          ]

          all_master_validation=[]
          all_results=[]
          all_predictions=[]
          all_daily=[]
          all_metrics=[]
          all_radar=[]

          exact_kinds=[
              "馬連4頭BOX","ワイド4頭BOX","3連複4頭BOX",
              "◎－○▲△ 馬連","◎－○▲△ ワイド","◎－○▲△－○▲△ 3連複","三連単2点"
          ]
          radar_kinds=[
              "レーダー複勝","レーダー－◎○ 馬連","レーダー－◎○ ワイド",
              "レーダー－◎○▲ 馬連","レーダー－◎○▲ ワイド"
          ]

          for track in ("saga","kochi"):
              track_validation=[]
              track_daily={}
              track_jp=jp[track]
              refund_url=f"https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RefundMoneyList?k_babaCode={baba[track]}&k_raceDate=2026%2F09%2F26"
              ext_path=f"/競馬データ基盤/検証明細原本/2026/09/{race_date}_{track_jp}_validation.csv"

              for rno,p in preds[track].items():
                  race=compact["tracks"][track][str(rno)]
                  meta=result_meta(track,rno)
                  names=name_map(track,rno)
                  ranks=rank_map(track,rno)
                  canc=cancelled(track,rno)
                  t3=top3(track,rno)
                  t3nos=[x["horse_no"] for x in t3]
                  active=[x for x in p["idx"] if x not in canc]

                  canc_txt="なし"
                  if canc:
                      canc_txt="; ".join(f"{x} {names.get(x,'')} 出走取消" for x in sorted(canc))
                  result_url=race["url"]
                  all_results.append([
                      f"20260926|{track_jp}|{rno}", race_date, track_jp, rno, "確定",
                      meta["condition"], meta["distance"], meta["class"], meta["headcount"],
                      t3[0]["horse_no"],t3[0]["horse_name"],t3[1]["horse_no"],t3[1]["horse_name"],
                      t3[2]["horse_no"],t3[2]["horse_name"],canc_txt,result_url,now,"9/26佐賀・高知最終結果検証"
                  ])

                  pred_id=f"20260926|{track_jp}|{rno}|Qオバ指数|固定日時未確認"
                  cond=f"{meta['class']}・{meta['surface']}{meta['distance']}m" if meta["distance"] else meta["class"]
                  all_predictions.append([
                      pred_id,race_date,track_jp,rno,"オバ指数","", "はい","対象",cond,meta["distance"],meta["headcount"],
                      p["idx"][0],names.get(p["idx"][0],""),p["idx"][1],names.get(p["idx"][1],""),
                      p["idx"][2],names.get(p["idx"][2],""),p["idx"][3],names.get(p["idx"][3],""),
                      p["radar"] if p["radar"] is not None else "", names.get(p["radar"],"") if p["radar"] is not None else "",
                      "", "公式結果で馬名再照合","いいえ",canc_txt if canc else "",
                      "/競馬予想記録/オバ指数/2026-09-26_佐賀・高知_Qオバ指数_事前固定復元版.md",
                      "2026-09-26運用",
                      "結果前会話で固定済みの馬番を9/27にLibraryへ復元。固定日時は未確認。指数値は後付けせず欠損。馬名は公式結果で再照合。",
                      "","","","","","","","欠損（馬番固定のみ）"
                  ])

                  # exact strategies
                  for kind in exact_kinds:
                      z=exact_strategy(track,rno,p,kind)
                      note="各100円。取消馬は購入点数から除外。"
                      if kind=="三連単2点":
                          note+=" 100倍条件は三連単m10原本未取得のため別途未判定。"
                      row=[
                          f"20260926|{track_jp}|{rno}|オバ指数|{kind}|確定払戻",
                          race_date,track_jp,rno,"オバ指数",kind,"確定払戻","条件なし",
                          z["points"],z["invest"],z["return"],z["return"]-z["invest"],
                          (z["return"]/z["invest"] if z["invest"] else 0),
                          "はい" if z["hits"] else "いいえ","該当なし（確定払戻）",refund_url,"確定",
                          note,ext_path,"保存済み"
                      ]
                      track_validation.append(row); all_master_validation.append(row)
                      key=("オバ指数",kind,"確定払戻","条件なし")
                      d=track_daily.setdefault(key,{"hits":0,"races":0,"invest":0,"return":0})
                      d["races"]+=1; d["invest"]+=z["invest"]; d["return"]+=z["return"]
                      if z["hits"]: d["hits"]+=1

                  # m10 thresholds
                  for label in threshold_cfg:
                      z=threshold_strategy(track,rno,p,label)
                      th=threshold_cfg[label][2]
                      condition=f"{th}倍以上（m10 odds_low）"
                      note="GitHub m10取得値で事前オッズ条件を判定。各100円。取消馬は購入点数から除外。"
                      row=[
                          f"20260926|{track_jp}|{rno}|オバ指数|{label}|m10",
                          race_date,track_jp,rno,"オバ指数",label,"m10",condition,
                          z["points"],z["invest"],z["return"],z["return"]-z["invest"],
                          (z["return"]/z["invest"] if z["invest"] else 0),
                          "はい" if z["hits"] else "いいえ",
                          f"{track}_daily_odds_20260926.csv",refund_url,"確定",note,ext_path,"保存済み"
                      ]
                      track_validation.append(row); all_master_validation.append(row)
                      key=("オバ指数",label,"m10",condition)
                      d=track_daily.setdefault(key,{"hits":0,"races":0,"invest":0,"return":0})
                      d["races"]+=1; d["invest"]+=z["invest"]; d["return"]+=z["return"]
                      if z["hits"]: d["hits"]+=1

                  # radar validation / strategies
                  if p["radar"] is not None:
                      radar=p["radar"]
                      qhits=sum(1 for x in t3nos if x in active)
                      plus_hits=sum(1 for x in t3nos if x in set(active+[radar]))
                      radar_rank=ranks.get(radar)
                      add_capture = radar_rank in (1,2,3)
                      top2=set(t3nos[:2]); top3set=set(t3nos)
                      qset=set(active); plusset=qset|{radar}
                      um_rescue=(not top2.issubset(qset)) and top2.issubset(plusset)
                      tri_rescue=(not top3set.issubset(qset)) and top3set.issubset(plusset)
                      pp=place_payout(track,rno,radar)
                      all_radar.append([
                          f"20260926|{track_jp}|{rno}|Q補完",race_date,track_jp,rno,pred_id,radar,names.get(radar,""),"はい",
                          "未保存","","","未確認","","",radar_rank if radar_rank is not None else "",
                          "はい" if radar_rank in (1,2,3) else "いいえ",
                          "はい" if radar_rank==1 else "いいえ",100,pp,(pp/100 if pp else 0),
                          qhits,plus_hits,"はい" if add_capture else "いいえ",
                          "はい" if um_rescue else "いいえ","はい" if tri_rescue else "いいえ",
                          result_url,"確定",
                          "事前保存レーダーを結果後検証。5頭BOX非採用。根拠タグは当時原文未保存のため後付けしない。",
                          "2026-09-26運用","はい" if radar_rank==4 else "いいえ"
                      ])
                      for kind in radar_kinds:
                          z=radar_strategy(track,rno,p,kind)
                          row=[
                              f"20260926|{track_jp}|{rno}|オバレーダー（Q補完）|{kind}|確定払戻",
                              race_date,track_jp,rno,"オバレーダー（Q補完）",kind,"確定払戻","条件なし",
                              z["points"],z["invest"],z["return"],z["return"]-z["invest"],
                              (z["return"]/z["invest"] if z["invest"] else 0),
                              "はい" if z["hits"] else "いいえ","該当なし（確定払戻）",refund_url,"確定",
                              "5頭BOX非採用・追加研究買い。各100円。取消馬は購入点数から除外。",
                              ext_path,"保存済み"
                          ]
                          track_validation.append(row); all_master_validation.append(row)
                          key=("オバレーダー（Q補完）",kind,"確定払戻","条件なし")
                          d=track_daily.setdefault(key,{"hits":0,"races":0,"invest":0,"return":0})
                          d["races"]+=1; d["invest"]+=z["invest"]; d["return"]+=z["return"]
                          if z["hits"]: d["hits"]+=1

              # per-track validation CSV
              with (OUT/f"{race_date}_{track_jp}_validation.csv").open("w",newline="",encoding="utf-8-sig") as f:
                  w=csv.writer(f); w.writerow(validation_headers)
                  for i,row in enumerate(track_validation):
                      w.writerow([i]+row)

              # daily summary rows
              for (method,kind,odds_point,condition),d in track_daily.items():
                  roi=d["return"]/d["invest"] if d["invest"] else 0
                  all_daily.append([
                      f"20260926|{track_jp}|{method}|{kind}|{odds_point}",race_date,track_jp,method,kind,"確定",
                      d["hits"],d["races"],(d["hits"]/d["races"] if d["races"] else 0),
                      d["invest"],d["return"],d["return"]-d["invest"],roi,condition,
                      "9/26全対象R最終。各100円。取消馬は購入点数から除外。m10はGitHub取得odds_low判定。",
                      refund_url
                  ])

              # metrics row
              races_count=len(preds[track])
              active_count=0; q_hit_total=0; any_r=0; mark1wins=0; mark1places=0; mark2places=0
              full3=0; mraces=0; wide_hits_total=0; wide1r=0; wide3r=0; trir=0
              wide_invest=0;wide_return=0;tri_invest=0;tri_return=0;simul_wide=0;simul_tri=0
              radar_count=0;radar3=0;radar1=0;radar_place_return=0;add_r=0;um_res=0;tri_res=0;radar4=0
              for rno,p in preds[track].items():
                  canc=cancelled(track,rno)
                  active=[x for x in p["idx"] if x not in canc]
                  active_count += len(active)
                  ranks=rank_map(track,rno)
                  t3nos=[x["horse_no"] for x in top3(track,rno)]
                  qh=sum(1 for x in t3nos if x in active)
                  q_hit_total += qh
                  if qh>0:any_r+=1
                  if ranks.get(p["idx"][0])==1:mark1wins+=1
                  if ranks.get(p["idx"][0]) in (1,2,3):mark1places+=1
                  if ranks.get(p["idx"][1]) in (1,2,3):mark2places+=1
                  if qh==3:full3+=1

                  m=exact_strategy(track,rno,p,"馬連4頭BOX")
                  w=exact_strategy(track,rno,p,"ワイド4頭BOX")
                  t=exact_strategy(track,rno,p,"3連複4頭BOX")
                  if m["hits"]:mraces+=1
                  wide_hits_total += w["hits"]
                  if w["hits"]==1:wide1r+=1
                  if w["hits"]==3:wide3r+=1
                  if t["hits"]:trir+=1
                  wide_invest+=w["invest"]; wide_return+=w["return"]
                  tri_invest+=t["invest"]; tri_return+=t["return"]
                  if w["hits"]==3 and t["hits"]:
                      simul_wide += w["return"]; simul_tri += t["return"]

                  if p["radar"] is not None:
                      radar_count+=1
                      rr=ranks.get(p["radar"])
                      if rr in (1,2,3):
                          radar3+=1;add_r+=1
                      if rr==1:radar1+=1
                      if rr==4:radar4+=1
                      radar_place_return += place_payout(track,rno,p["radar"])
                      qset=set(active); plus=qset|{p["radar"]}
                      top2=set(t3nos[:2]); top3set=set(t3nos)
                      if (not top2.issubset(qset)) and top2.issubset(plus): um_res+=1
                      if (not top3set.issubset(qset)) and top3set.issubset(plus): tri_res+=1

              all_metrics.append([
                  f"20260926|{track_jp}|オバ指数",race_date,track_jp,"オバ指数",races_count,
                  mark1wins,mark1wins/races_count,mark1places,mark1places/races_count,
                  active_count,q_hit_total,q_hit_total/active_count,any_r,any_r/races_count,
                  radar_count,radar3,(radar3/radar_count if radar_count else 0),
                  f"9/26最終。事前固定Q本体＋レーダー。固定日時は未確認のため後付けせず欠損。固定4頭枠分母では{q_hit_total}/{races_count*4}。",
                  radar1,(radar1/radar_count if radar_count else 0),
                  radar_count*100,radar_place_return,(radar_place_return/(radar_count*100) if radar_count else 0),
                  add_r,(add_r/radar_count if radar_count else 0),um_res,tri_res,
                  f"指数外{radar_count}頭。5頭BOX不採用。m10閾値買いは日次集計で分離。",
                  mark2places,mark2places/races_count,full3,full3/races_count,mraces,mraces/races_count,
                  wide_hits_total,wide1r,wide3r,wide3r/races_count,trir,trir/races_count,
                  sum(1 for rno,p in preds[track].items() if exact_strategy(track,rno,p,"ワイド4頭BOX")["hits"]==3 and exact_strategy(track,rno,p,"3連複4頭BOX")["hits"]),
                  sum(1 for rno,p in preds[track].items() if exact_strategy(track,rno,p,"ワイド4頭BOX")["hits"]==3 and exact_strategy(track,rno,p,"3連複4頭BOX")["hits"])/races_count,
                  wide_invest,wide_return,tri_invest,tri_return,wide_invest+tri_invest,wide_return+tri_return,
                  (wide_return+tri_return)/(wide_invest+tri_invest),
                  simul_wide,simul_tri,simul_wide+simul_tri,radar4,(radar4/radar_count if radar_count else 0)
              ])

          # Master input CSVs
          def write_csv(name, headers, rows):
              with (OUT/name).open("w",newline="",encoding="utf-8-sig") as f:
                  w=csv.writer(f); w.writerow(headers); w.writerows(rows)

          write_csv("master_prediction_rows.csv", prediction_headers, all_predictions)
          write_csv("master_result_rows.csv", result_headers, all_results)
          write_csv("master_validation_rows.csv", master_validation_headers, all_master_validation)
          write_csv("master_daily_rows.csv", daily_headers, all_daily)
          write_csv("master_metrics_rows.csv", metric_headers, all_metrics)
          write_csv("master_radar_rows.csv", radar_headers, all_radar)

          # Recovery archive markdown
          lines=[
              "# 2026-09-26 佐賀・高知 Qオバ指数 事前固定復元版",
              "",
              "保存日：2026-09-27（結果確定後）",
              "",
              "## 重要",
              "このファイルは結果後に新しく予想を作ったものではない。",
              "結果前の会話で固定済みだった馬番・オバレーダーを、結果検証後にLibraryへ復元保存するためのアーカイブ。",
              "固定時刻は現時点で確認できないため空欄扱い。指数値も未確認のため後付けしない。",
              "馬名はNAR公式結果で再照合した。",
              "",
          ]
          for track in ("saga","kochi"):
              lines += [f"## {jp[track]}", ""]
              for rno,p in preds[track].items():
                  names=name_map(track,rno)
                  marks=["◎","○","▲","△"]
                  main=" / ".join(f"{marks[i]}{n} {names.get(n,'')}" for i,n in enumerate(p["idx"]))
                  radar=(f" / レーダー {p['radar']} {names.get(p['radar'],'')}" if p["radar"] is not None else "")
                  lines.append(f"- {rno}R：{main}{radar}")
              lines.append("")
          (OUT/"2026-09-26_佐賀・高知_Qオバ指数_事前固定復元版.md").write_text("\n".join(lines),encoding="utf-8")

          # summary json for verification
          summary={
              "validation_rows":len(all_master_validation),
              "prediction_rows":len(all_predictions),
              "result_rows":len(all_results),
              "daily_rows":len(all_daily),
              "metric_rows":len(all_metrics),
              "radar_rows":len(all_radar),
          }
          (OUT/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(summary)
          PY

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: validation-20260926
          path: out/
          if-no-files-found: error
          retention-days: 3
