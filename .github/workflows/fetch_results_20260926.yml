name: Build 2026-09-26 validation inputs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch_results_20260926.yml"

permissions:
  contents: write

jobs:
  build-validation-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build compact m10 odds for fixed predictions
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json, itertools

          preds = {
              "saga": {
                  2:[1,6,4,3], 3:[2,8,1,5], 4:[9,10,6,4],
                  5:[5,9,3,6], 6:[7,4,8,1], 7:[3,8,9,2],
                  8:[8,5,7,4], 9:[4,10,12,2], 10:[9,7,1,10],
              },
              "kochi": {
                  1:[3,4,8,10], 2:[6,5,7,9], 3:[7,6,9,11],
                  4:[4,7,2,3], 5:[6,2,7,8], 6:[7,8,2,5],
                  7:[7,1,6,5], 8:[10,8,7,1], 9:[7,1,6,4],
                  10:[9,5,6,8], 11:[12,2,10,5],
              }
          }

          def norm(combo):
              return "-".join(str(x) for x in sorted(int(v) for v in combo))

          out = {"race_date":"2026-09-26","minutes_before":10,"tracks":{}}
          base = Path("data/2026-09-26")

          for track, races in preds.items():
              path = base / f"{track}_daily_odds_20260926.csv"
              relevant = {}
              for rno, idx in races.items():
                  for bet in ("馬連","ワイド"):
                      for c in itertools.combinations(idx, 2):
                          relevant[(rno,bet,norm(c))] = None
                  for c in itertools.combinations(idx, 3):
                      relevant[(rno,"三連複",norm(c))] = None

              with path.open("r", newline="", encoding="utf-8-sig") as f:
                  for row in csv.DictReader(f):
                      try:
                          rno = int(row["race_no"])
                          minute = int(row["minutes_before"])
                      except Exception:
                          continue
                      if minute != 10:
                          continue
                      key=(rno,row["bet_type"].strip(),norm(row["combination"].split("-")))
                      if key not in relevant:
                          continue
                      prev=relevant[key]
                      if prev is None or row["captured_at"] > prev["captured_at"]:
                          relevant[key]={
                              "captured_at":row["captured_at"],
                              "source_time":row["source_time"],
                              "combination":key[2],
                              "odds_low":row["odds_low"],
                              "odds_high":row["odds_high"],
                              "popularity":row["popularity"],
                          }

              track_out={}
              for rno, idx in races.items():
                  race_out={}
                  for bet in ("馬連","ワイド","三連複"):
                      rows=[]
                      for (rr,bb,cc), val in relevant.items():
                          if rr==rno and bb==bet and val is not None:
                              rows.append(val)
                      rows.sort(key=lambda x: tuple(map(int,x["combination"].split("-"))))
                      race_out[bet]=rows
                  track_out[str(rno)]=race_out
              out["tracks"][track]=track_out

          dest=base/"m10_fixed_prediction_odds_20260926.json"
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("saved",dest)
          for track,races in out["tracks"].items():
              for rno,r in races.items():
                  print(track,rno,{k:len(v) for k,v in r.items()})
          PY

      - name: Commit validation inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2026-09-26/m10_fixed_prediction_odds_20260926.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build m10 odds inputs for 2026-09-26 validation"
          git pull --rebase origin main
          git push origin main
