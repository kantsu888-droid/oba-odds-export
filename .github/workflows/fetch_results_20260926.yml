name: Fetch 2026-09-26 NAR results

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch_results_20260926.yml"

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4

      - name: Fetch official NAR result pages
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json
          import time

          race_date = "2026/09/26"
          tracks = {
              "saga": {"code": "32", "races": range(1, 11)},
              "kochi": {"code": "31", "races": range(1, 12)},
          }

          output = {
              "race_date": race_date,
              "source": "NAR RaceMarkTable",
              "tracks": {},
          }

          base = "https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceMarkTable"

          for track, cfg in tracks.items():
              output["tracks"][track] = {}
              for race_no in cfg["races"]:
                  params = {
                      "k_raceDate": race_date,
                      "k_babaCode": cfg["code"],
                      "k_raceNo": str(race_no),
                  }
                  url = base + "?" + urlencode(params)
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  print("fetch", track, race_no, url)
                  with urlopen(req, timeout=30) as res:
                      raw = res.read()

                  html = raw.decode("utf-8", errors="ignore")
                  soup = BeautifulSoup(html, "html.parser")

                  tables = []
                  for table in soup.find_all("table"):
                      rows = []
                      for tr in table.find_all("tr"):
                          cells = [
                              cell.get_text(" ", strip=True)
                              for cell in tr.find_all(["th", "td"])
                          ]
                          if cells:
                              rows.append(cells)
                      if rows:
                          tables.append(rows)

                  text = soup.get_text("\n", strip=True)

                  output["tracks"][track][str(race_no)] = {
                      "url": url,
                      "title": soup.title.get_text(" ", strip=True) if soup.title else "",
                      "tables": tables,
                      "text": text,
                  }
                  time.sleep(0.3)

          out = Path("data/2026-09-26/nar_results_tables_20260926.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("saved", out)
          PY

      - name: Commit fetched results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2026-09-26/nar_results_tables_20260926.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fetch official NAR results for 2026-09-26"
          git pull --rebase origin main
          git push origin main
