name: Private VPS Dispatch Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private_vps_dispatch_bridge.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"
      timezone: "Asia/Tokyo"
    - cron: "10 6 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: private-vps-dispatch-bridge-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve private workflow
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}:${EVENT_SCHEDULE}" in
            push:*|workflow_dispatch:*)
              workflow="q_system_readiness.yml"
              ;;
            schedule:"45 5 * * *")
              workflow="q_daily_auto_eval.yml"
              ;;
            schedule:"10 6 * * *")
              workflow="soi_lab_validate.yml"
              ;;
            schedule:"0 8 * * *")
              workflow="soi_lab_freeze.yml"
              ;;
            *)
              echo "Unsupported trigger: ${EVENT_NAME} / ${EVENT_SCHEDULE}" >&2
              exit 2
              ;;
          esac
          echo "workflow=${workflow}" >> "$GITHUB_OUTPUT"

      - name: Dispatch private workflow to VPS
        shell: bash
        env:
          PRIVATE_PAT: ${{ secrets.SOURCE_PAT }}
          WORKFLOW: ${{ steps.target.outputs.workflow }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_PAT}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRIVATE_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/kantsu888-droid/oba-odds/actions/workflows/${WORKFLOW}/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched ${WORKFLOW} to private self-hosted VPS runner."
