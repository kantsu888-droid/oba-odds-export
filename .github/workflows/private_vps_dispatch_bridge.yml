name: Private VPS Dispatch Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private_vps_dispatch_bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-vps-dispatch-bridge-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve private slot
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}:${EVENT_SCHEDULE}" in
            push:*|workflow_dispatch:*)
              slot="readiness"
              ;;
            schedule:"45 5 * * *")
              slot="q_daily"
              ;;
            schedule:"10 6 * * *")
              slot="soi_validate"
              ;;
            schedule:"7 8 * * *")
              slot="soi_freeze"
              ;;
            *)
              echo "Unsupported trigger: ${EVENT_NAME} / ${EVENT_SCHEDULE}" >&2
              exit 2
              ;;
          esac
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"

      - name: Update private trigger file
        shell: bash
        env:
          PRIVATE_PAT: ${{ secrets.SOURCE_PAT }}
          SLOT: ${{ steps.target.outputs.slot }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_PAT}"

          api="https://api.github.com/repos/kantsu888-droid/oba-odds/contents/data/ops/vps_schedule_triggers/${SLOT}.json"
          sha="$(
            curl --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${PRIVATE_PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | jq -r '.sha // empty'
          )"

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -nc \
            --arg slot "$SLOT" \
            --arg at "$now" \
            --arg run "${GITHUB_RUN_ID}" \
            '{schema_version:"vps-schedule-trigger-v1",slot:$slot,triggered_at:$at,public_run_id:$run}')"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"

          body="$(jq -nc \
            --arg message "Trigger private VPS schedule: ${SLOT}" \
            --arg content "$encoded" \
            --arg branch "main" \
            --arg sha "$sha" \
            'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end')"

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRIVATE_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$body"

          echo "Updated private trigger slot: $SLOT"
