name: Public Odds Auto Capture

on:
  workflow_dispatch:
  # Emergency/manual trigger that needs only a normal git push. Updating a
  # file under ops/capture-trigger/ runs the same capture path without a
  # cross-repository Actions API token.
  push:
    branches: [main]
    paths:
      - "ops/capture-trigger/**"
  # All times are JST. Run every day regardless of weekday.
  # Offset from the top of the hour because GitHub notes scheduled runs can
  # be delayed or dropped during high load around :00.
  # 09:47 discovers today's meetings.
  # 10:02-20:57 covers the NAR sales window at 5-minute cadence.
  # 21:02 is a final safety run for late races.
  schedule:
    - cron: "47 9 * * *"
      timezone: "Asia/Tokyo"
    - cron: "2/5 10-20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "2 21 * * *"
      timezone: "Asia/Tokyo"

permissions:
  actions: write
  contents: write

concurrency:
  group: public-odds-auto-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: kantsu888-droid/oba-odds
          token: ${{ secrets.SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify activated public workflow pin
        shell: bash
        run: |
          set -euo pipefail
          ACTIVATION="source/docs/soi_prospective_activation_v1.json"
          if [ ! -f "$ACTIVATION" ]; then
            echo "Prospective not activated; workflow pin check is inert."
            exit 0
          fi

          PINNED="$(
            python - "$ACTIVATION" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              obj = json.load(f)
          value = str(obj.get("public_export_workflow_commit") or "").strip()
          if len(value) != 40:
              raise SystemExit("activation public workflow commit is invalid")
          print(value)
          PY
          )"

          git cat-file -e "${PINNED}^{commit}"
          git show "${PINNED}:.github/workflows/public_auto_capture.yml" \
            > /tmp/activation-pinned-public-auto-capture.yml

          if ! cmp -s \
            .github/workflows/public_auto_capture.yml \
            /tmp/activation-pinned-public-auto-capture.yml; then
            echo "Current public capture workflow differs from activation pin."
            exit 1
          fi
          echo "Activated public workflow pin verified: $PINNED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed source with existing public data
        run: |
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          mkdir -p "source/data/${TODAY}"

          if [ -d "data/${TODAY}" ]; then
            echo "Restore existing ${TODAY} data into source workspace"
            cp -R "data/${TODAY}/." "source/data/${TODAY}/"
          else
            echo "No existing public data for ${TODAY}; start fresh"
          fi

      - name: Refresh today's all-track schedule
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          mkdir -p "data/${TODAY}"

          echo "Refresh all six target tracks for ${TODAY}."
          if python fetch_schedule_all.py; then
            echo "Schedule refresh succeeded."
          elif compgen -G "data/${TODAY}/all_schedule_*.csv" > /dev/null; then
            echo "Schedule refresh failed; retain the latest existing schedule."
          else
            echo "Schedule refresh failed and no prior schedule exists."
            exit 1
          fi

      - name: Capture odds without private-repository pushes
        id: capture
        working-directory: source
        env:
          AUTO_CAPTURE_LOOK_AHEAD_SECONDS: "600"
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee /tmp/public_auto_capture.log
          import auto_capture_all

          def skip_private_push(target_dt):
              print(
                  "Public runner: skip private-repository checkpoint push "
                  + target_dt.strftime("%H:%M:%S")
              )

          auto_capture_all.checkpoint_captured_data = skip_private_push
          auto_capture_all.main()
          PY

          if grep -q '^OK  ' /tmp/public_auto_capture.log; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
          fi

          python - <<'PY'
          import os
          import re

          races = []
          seen = set()
          with open(
              "/tmp/public_auto_capture.log",
              encoding="utf-8",
              errors="replace",
          ) as f:
              for line in f:
                  match = re.match(
                      r"^OK\s+(\S+)\s+(\d+)R\s+m15\s*$",
                      line,
                  )
                  if not match:
                      continue
                  key = f"{match.group(1)}:{int(match.group(2))}"
                  if key not in seen:
                      seen.add(key)
                      races.append(key)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(
                  "m15_captured="
                  + ("true" if races else "false")
                  + "\n"
              )
              f.write("m15_races=" + ",".join(races) + "\n")
          print("New m15 races:", ",".join(races) if races else "none")
          PY

      - name: Merge daily odds
        if: steps.capture.outputs.captured == 'true'
        working-directory: source
        run: python merge_daily_odds_all.py

      - name: Sync public repository
        run: git pull --rebase origin main

      - name: Copy today's data
        run: |
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          mkdir -p "data/${TODAY}"

          if [ -d "source/data/${TODAY}" ]; then
            cp -R "source/data/${TODAY}/." "data/${TODAY}/"
          else
            echo "No source data directory for ${TODAY}"
          fi

      - name: Commit data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update odds data"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            if git pull --rebase origin main && git push origin main; then
              echo "Public data pushed successfully"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git rebase --abort || true
            sleep 5
          done

          echo "Failed to push public data after 3 attempts"
          exit 1

      - name: Build pre-race SOI public commitment
        if: steps.capture.outputs.m15_captured == 'true' && steps.commit.outputs.changed == 'true'
        env:
          EXPORT_COMMIT: ${{ steps.commit.outputs.commit_sha }}
          M15_RACES: ${{ steps.capture.outputs.m15_races }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          PRIVATE_SOURCE_COMMIT="$(git -C source rev-parse HEAD)"

          rm -rf /tmp/soi-prospective
          mkdir -p /tmp/soi-prospective

          RACE_ARGS=()
          IFS=',' read -ra RACES <<< "$M15_RACES"
          for race in "${RACES[@]}"; do
            if [ -n "$race" ]; then
              RACE_ARGS+=(--race "$race")
            fi
          done

          python source/soi_prospective_m15_ingest.py             --repo-root source             --export-data-dir "data/${TODAY}"             --export-commit "$EXPORT_COMMIT"             --target-date "$TODAY"             --output-root /tmp/soi-prospective             --summary-output /tmp/soi-prospective-summary.json             "${RACE_ARGS[@]}"

          mkdir -p "data/soi_commitments/${TODAY}"
          COMMITMENT_PATH="data/soi_commitments/${TODAY}/${EXPORT_COMMIT}.json"

          python source/soi_prospective_public_commitment.py             --receipt-root /tmp/soi-prospective             --target-date "$TODAY"             --public-odds-commit "$EXPORT_COMMIT"             --private-source-commit "$PRIVATE_SOURCE_COMMIT"             --output "$COMMITMENT_PATH"

          {
            echo "# SOI m15 prospective dry-run / commitment"
            echo
            echo "- target_date: $TODAY"
            echo "- public_odds_commit: $EXPORT_COMMIT"
            echo "- private_source_commit: $PRIVATE_SOURCE_COMMIT"
            echo "- m15_races: $M15_RACES"
            echo
            echo '~~~json'
            cat /tmp/soi-prospective-summary.json
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit public SOI commitment
        if: steps.capture.outputs.m15_captured == 'true' && steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/soi_commitments/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No SOI public commitment to persist"
            exit 0
          fi

          git commit -m "Commit SOI prospective m15 hashes"

          for attempt in 1 2 3; do
            echo "Commitment push attempt ${attempt}/3"
            if git pull --rebase origin main && git push origin main; then
              echo "SOI public commitment pushed successfully"
              exit 0
            fi

            git rebase --abort || true
            sleep 5
          done

          echo "Failed to push SOI public commitment after 3 attempts"
          exit 1

      - name: Continue capture chain
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Tokyo date +%F)"

          DELAY="$(
            python - "$TODAY" <<'PY'
          import csv
          import glob
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          TARGET_MINUTES = (30, 15, 10, 5, 2)
          RELAY_MAX_SECONDS = 5400
          DISPATCH_LEAD_SECONDS = 480
          MAX_LATE_SECONDS = 120

          target_date = sys.argv[1]
          folder = Path("data") / target_date
          schedules = sorted(folder.glob("all_schedule_*.csv"))
          if not schedules:
              print("none")
              raise SystemExit(0)

          schedule = schedules[-1]
          now = datetime.now(JST)
          targets = []

          with schedule.open("r", newline="", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  start = datetime.strptime(
                      f"{row['race_date']} {row['start_time']}",
                      "%Y-%m-%d %H:%M",
                  ).replace(tzinfo=JST)
                  track = row["track"].strip()
                  race_no = int(row["race_no"])
                  for minutes_before in TARGET_MINUTES:
                      pattern = (
                          folder
                          / f"{track}_{race_no}R_m{minutes_before}_*_odds.csv"
                      )
                      if glob.glob(str(pattern)):
                          continue
                      target = start - timedelta(minutes=minutes_before)
                      if target < now - timedelta(seconds=MAX_LATE_SECONDS):
                          continue
                      targets.append(target)

          if not targets:
              print("none")
              raise SystemExit(0)

          next_target = min(targets)
          dispatch_at = next_target - timedelta(
              seconds=DISPATCH_LEAD_SECONDS
          )
          delay = max(0, int((dispatch_at - now).total_seconds()))
          delay = min(delay, RELAY_MAX_SECONDS)
          print(delay)
          PY
          )"

          if [ "$DELAY" = "none" ]; then
            echo "No future uncaptured targets; capture chain stops."
            exit 0
          fi

          echo "Next capture-chain dispatch in ${DELAY}s."
          if [ "$DELAY" -gt 0 ]; then
            sleep "$DELAY"
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/public_auto_capture.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Queued next Public Odds Auto Capture run."
