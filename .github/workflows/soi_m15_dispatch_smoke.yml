name: SOI m15 Dispatch Smoke

on:
  push:
    paths:
      - ".github/workflows/soi_m15_dispatch_smoke.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Send dry-run dispatch to private receiver
        env:
          SOURCE_PAT: ${{ secrets.SOURCE_PAT }}
          EXPORT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          export TARGET_DATE
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = json.dumps({
              "event_type": "soi_m15_ready",
              "client_payload": {
                  "target_date": os.environ["TARGET_DATE"],
                  "export_commit": os.environ["EXPORT_COMMIT"],
              },
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.github.com/repos/kantsu888-droid/oba-odds/dispatches",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['SOURCE_PAT']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oba-odds-export-smoke",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(response.status)
          print("repository_dispatch accepted")
          PY
